<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Vision Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: white;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.2rem;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        
        .camera-container {
            position: relative;
            margin: 20px 0;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }
        
        #video {
            width: 100%;
            max-width: 600px;
            height: auto;
            display: none;
            transform-origin: center;
            transition: transform 0.3s ease;
        }
        
        .camera-placeholder {
            width: 100%;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.1);
            border: 2px dashed rgba(255,255,255,0.3);
            margin: 20px 0;
            border-radius: 15px;
            font-size: 1.2rem;
        }
        
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 20px 0;
        }
        
        .control-group {
            background: transparent;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15);
            flex: 1;
        }
        
        .control-group label {
            font-size: 0.8rem;
            margin-bottom: 6px;
            text-align: center;
        }
        
        .interval-controls {
            flex-direction: column;
            gap: 6px;
        }
        
        .interval-controls span {
            display: none;
        }
        
        .interval-display {
            font-size: 0.9rem;
            padding: 4px 8px;
            text-align: center;
        }
        
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        button {
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 120px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .primary-btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
        }
        
        .secondary-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
        }
        
        .success-btn {
            background: linear-gradient(45deg, #00d2d3, #54a0ff);
            color: white;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .status {
            margin: 20px 0;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 500;
        }
        
        .status.active {
            background: rgba(76, 217, 100, 0.2);
            border: 1px solid rgba(76, 217, 100, 0.5);
        }
        
        .status.inactive {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .description {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            border: 1px solid rgba(255,255,255,0.2);
            font-size: 1.1rem;
            line-height: 1.6;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .description.empty {
            opacity: 0.7;
            font-style: italic;
        }
        
        .zoom-controls {
            position: absolute;
            top: 15px;
            right: 15px;
            display: none;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.7);
            padding: 8px 12px;
            border-radius: 25px;
            backdrop-filter: blur(10px);
        }
        
        .zoom-btn {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            padding: 0;
            min-width: auto;
            box-shadow: none;
        }
        
        .zoom-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: none;
        }
        
        #zoomLevel {
            color: white;
            font-size: 0.9rem;
            font-weight: 600;
            min-width: 40px;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 0;
                background: #000;
            }
            
            .container {
                max-width: 100%;
                height: 100vh;
                display: flex;
                flex-direction: column;
            }
            
            h1 {
                font-size: 1.2rem;
                margin: 8px 15px 5px;
            }
            
            .subtitle {
                font-size: 0.85rem;
                margin: 0 15px 8px;
                opacity: 0.8;
            }
            
            .camera-container {
                flex: 1;
                margin: 0;
                border-radius: 0;
                position: relative;
                overflow: hidden;
            }
            
            #video {
                width: 100%;
                height: 100%;
                max-width: none;
                object-fit: cover;
            }
            
            .camera-placeholder {
                height: 100%;
                margin: 0;
                border-radius: 0;
            }
            
            .zoom-controls {
                display: flex;
                top: 10px;
                right: 10px;
            }
            
            .mobile-overlay {
                position: absolute;
                z-index: 10;
                background: rgba(0,0,0,0.7);
                backdrop-filter: blur(10px);
                border-radius: 12px;
                margin: 8px;
                padding: 8px 12px;
            }
            
            .controls.mobile-overlay {
                top: 60px;
                left: 0;
                right: 0;
                display: flex;
                flex-direction: row;
                gap: 8px;
            }
            
            .control-group {
                background: transparent;
                padding: 8px;
                border-radius: 8px;
                border: 1px solid rgba(255,255,255,0.15);
                flex: 1;
            }
            
            .control-group label {
                font-size: 0.8rem;
                margin-bottom: 6px;
                text-align: center;
            }
            
            .interval-controls {
                flex-direction: column;
                gap: 6px;
            }
            
            .interval-controls span {
                display: none;
            }
            
            .interval-display {
                font-size: 0.9rem;
                padding: 4px 8px;
                text-align: center;
            }
            
            input[type="range"] {
                min-width: 80px;
                height: 6px;
            }
            
            .buttons.mobile-overlay {
                bottom: 80px;
                left: 0;
                right: 0;
                flex-direction: row;
                justify-content: center;
                gap: 8px;
                padding: 8px;
            }
            
            .status.mobile-overlay {
                bottom: 50px;
                left: 0;
                right: 0;
                margin: 8px;
                padding: 8px 12px;
                font-size: 0.9rem;
                min-height: auto;
            }
            
            .description.mobile-overlay {
                bottom: 0;
                left: 0;
                right: 0;
                min-height: 45px;
                margin: 0;
                border-radius: 0;
                font-size: 0.9rem;
                padding: 8px 12px;
                text-align: left;
                align-items: flex-start;
                max-height: 45px;
                overflow-y: auto;
                line-height: 1.3;
            }
            
            button {
                width: auto;
                max-width: none;
                padding: 8px 16px;
                font-size: 0.9rem;
                border-radius: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📺 TV Vision Assistant</h1>
        <p class="subtitle">Point your camera at the TV and I'll tell you what's happening!</p>
        
        <div class="camera-container">
            <video id="video" autoplay playsinline></video>
            <div id="cameraPlaceholder" class="camera-placeholder">
                📷 Camera will appear here
            </div>
            <div class="zoom-controls">
                <button id="zoomOut" class="zoom-btn">−</button>
                <span id="zoomLevel">1.0x</span>
                <button id="zoomIn" class="zoom-btn">+</button>
            </div>
        </div>
        
        <div class="controls mobile-overlay">
            <div class="control-group">
                <label>Camera Zoom</label>
                <div class="interval-controls">
                    <span>0.5x</span>
                    <input type="range" id="zoomSlider" min="0.5" max="3" step="0.1" value="1">
                    <span>3x</span>
                    <div class="interval-display" id="zoomSliderDisplay">1.0x</div>
                </div>
            </div>
            <div class="control-group">
                <label>Analysis Frequency</label>
                <div class="interval-controls">
                    <span>1s</span>
                    <input type="range" id="intervalSlider" min="1" max="30" value="5">
                    <span>30s</span>
                    <div class="interval-display" id="intervalDisplay">5s</div>
                </div>
            </div>
        </div>
        
        <div class="buttons mobile-overlay">
            <button id="startCamera" class="primary-btn">Start Camera</button>
            <button id="toggleAnalysis" class="success-btn" disabled>Start Analysis</button>
            <button id="analyzeNow" class="secondary-btn" disabled>Analyze Now</button>
        </div>
        
        <div id="status" class="status inactive mobile-overlay">
            Ready to start
        </div>
        
        <div id="description" class="description empty mobile-overlay">
            Analysis results will appear here...
        </div>
    </div>

    <script>
        let video;
        let canvas;
        let analysisInterval;
        let isAnalyzing = false;
        let currentInterval = 5;
        let currentZoom = 1;
        
        // DOM elements
        const startCameraBtn = document.getElementById('startCamera');
        const toggleAnalysisBtn = document.getElementById('toggleAnalysis');
        const analyzeNowBtn = document.getElementById('analyzeNow');
        const statusDiv = document.getElementById('status');
        const descriptionDiv = document.getElementById('description');
        const intervalSlider = document.getElementById('intervalSlider');
        const intervalDisplay = document.getElementById('intervalDisplay');
        const cameraPlaceholder = document.getElementById('cameraPlaceholder');
        const zoomInBtn = document.getElementById('zoomIn');
        const zoomOutBtn = document.getElementById('zoomOut');
        const zoomLevelSpan = document.getElementById('zoomLevel');
        const zoomControls = document.querySelector('.zoom-controls');
        const zoomSlider = document.getElementById('zoomSlider');
        const zoomSliderDisplay = document.getElementById('zoomSliderDisplay');
        
        // Initialize
        video = document.getElementById('video');
        canvas = document.createElement('canvas');
        
        // Zoom controls
        zoomInBtn.addEventListener('click', () => {
            currentZoom = Math.min(currentZoom + 0.2, 3);
            updateZoom();
        });
        
        zoomOutBtn.addEventListener('click', () => {
            currentZoom = Math.max(currentZoom - 0.2, 0.5);
            updateZoom();
        });
        
        function updateZoom() {
            video.style.transform = `scale(${currentZoom})`;
            zoomLevelSpan.textContent = `${currentZoom.toFixed(1)}x`;
            zoomSliderDisplay.textContent = `${currentZoom.toFixed(1)}x`;
            zoomSlider.value = currentZoom;
        }
        
        // Zoom slider control
        zoomSlider.addEventListener('input', (e) => {
            currentZoom = parseFloat(e.target.value);
            updateZoom();
        });
        
        // Pinch to zoom for mobile
        let initialDistance = 0;
        let initialZoom = 1;
        
        video.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                e.preventDefault();
                initialDistance = getDistance(e.touches[0], e.touches[1]);
                initialZoom = currentZoom;
            }
        });
        
        video.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                e.preventDefault();
                const currentDistance = getDistance(e.touches[0], e.touches[1]);
                const scale = currentDistance / initialDistance;
                currentZoom = Math.min(Math.max(initialZoom * scale, 0.5), 3);
                updateZoom();
            }
        });
        
        function getDistance(touch1, touch2) {
            const dx = touch1.clientX - touch2.clientX;
            const dy = touch1.clientY - touch2.clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }
        
        // Interval slider
        intervalSlider.addEventListener('input', (e) => {
            currentInterval = parseInt(e.target.value);
            intervalDisplay.textContent = `${currentInterval}s`;
            
            // If currently analyzing, restart with new interval
            if (isAnalyzing) {
                stopAnalysis();
                startAnalysis();
            }
        });
        
        // Camera setup
        startCameraBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                });
                
                video.srcObject = stream;
                video.style.display = 'block';
                cameraPlaceholder.style.display = 'none';
                zoomControls.style.display = 'flex';
                
                startCameraBtn.disabled = true;
                toggleAnalysisBtn.disabled = false;
                analyzeNowBtn.disabled = false;
                
                updateStatus('Camera ready - point at your TV', 'active');
                
            } catch (error) {
                console.error('Error accessing camera:', error);
                updateStatus('Camera access denied. Please allow camera permission.', 'inactive');
            }
        });
        
        // Analysis controls
        toggleAnalysisBtn.addEventListener('click', () => {
            if (isAnalyzing) {
                stopAnalysis();
            } else {
                startAnalysis();
            }
        });
        
        analyzeNowBtn.addEventListener('click', () => {
            analyzeFrame();
        });
        
        function startAnalysis() {
            isAnalyzing = true;
            toggleAnalysisBtn.textContent = 'Stop Analysis';
            toggleAnalysisBtn.className = 'primary-btn';
            updateStatus(`Analyzing every ${currentInterval} seconds...`, 'active');
            
            // Start immediate analysis
            analyzeFrame();
            
            // Set up interval
            analysisInterval = setInterval(() => {
                analyzeFrame();
            }, currentInterval * 1000);
        }
        
        function stopAnalysis() {
            isAnalyzing = false;
            toggleAnalysisBtn.textContent = 'Start Analysis';
            toggleAnalysisBtn.className = 'success-btn';
            updateStatus('Analysis stopped', 'inactive');
            
            if (analysisInterval) {
                clearInterval(analysisInterval);
                analysisInterval = null;
            }
        }
        
        async function analyzeFrame() {
            if (!video.srcObject) return;
            
            try {
                // Update status to show we're analyzing
                const originalStatus = statusDiv.textContent;
                updateStatus('📸 Analyzing TV content...', 'active');
                
                // Capture frame
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0);
                
                const imageDataUrl = canvas.toDataURL('image/jpeg', 0.8);
                
                // Send to AI for analysis
                const completion = await websim.chat.completions.create({
                    messages: [
                        {
                            role: "user",
                            content: [
                                {
                                    type: "text",
                                    text: `Please describe what's happening on this TV screen. Focus on:
                                    - What type of content it is (movie, show, news, commercial, etc.)
                                    - Main action or events occurring
                                    - Key characters or people visible
                                    - Any text or graphics shown
                                    - Overall scene or setting
                                    
                                    Keep the description clear and concise for someone who can't see the screen well. If you can't clearly see a TV screen in the image, mention that.`
                                },
                                {
                                    type: "image_url",
                                    image_url: { url: imageDataUrl }
                                }
                            ]
                        }
                    ]
                });
                
                const description = completion.content;
                updateDescription(description);
                
                // Read the description aloud
                try {
                    const ttsResult = await websim.textToSpeech({
                        text: description,
                        voice: "en-female"
                    });
                    
                    const audio = new Audio(ttsResult.url);
                    audio.play();
                } catch (ttsError) {
                    console.error('Text-to-speech error:', ttsError);
                }
                
                // Restore original status or update with analysis info
                if (isAnalyzing) {
                    updateStatus(`✅ Analysis complete - next in ${currentInterval}s`, 'active');
                } else {
                    updateStatus('Analysis complete', 'active');
                }
                
            } catch (error) {
                console.error('Analysis error:', error);
                updateStatus('❌ Analysis failed - please try again', 'inactive');
                updateDescription('Sorry, I couldn\'t analyze the TV content. Please make sure the camera is pointing at the TV screen and try again.');
            }
        }
        
        function updateStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }
        
        function updateDescription(text) {
            descriptionDiv.textContent = text;
            descriptionDiv.className = 'description';
        }
        
        // Initialize interval display
        intervalDisplay.textContent = `${currentInterval}s`;
    </script>
